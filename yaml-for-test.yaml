# 卧深1井 —— 四川盆地一口定向井（θ=35.57°），数据取自《卧深1井井身结构绘图基础数据表.xlsx》。
#
# 两栏用的深度基准不同，是按原图（同目录 123.jpg，同一口井的手工图）的惯例定的：
#   * 地层 / 钻井液两栏用表里的**垂深井段**——原图那一栏的表头写的就是「（垂深 m）」；
#   * 开次与套管用**斜深（井深）**——原图的井身结构标注就是斜深。
#   本井造斜点 5100m，所以 5100m 以上两栏逐条相等，只有最下面三层对不齐
#   （韩家店组~龙马溪组 斜深 5525 / 垂深 5490，五峰组~桐梓组 6091 / 5950，
#    洗象池组~高台组 6521 / 6300）。
#
# 13 层地层的底深与 13 段钻井液密度**逐条重合**，本可以用 §1④ 把底深只写一遍；
# 但头两层都叫「沙溪庙组」（重名），而 ④ 只开在映射写法那一支、映射写法当场拒重名，
# 所以这里退回数组写法、钻井液整块单写（§2）。
#
# 表里没有破裂压力（第 4 格一律省掉），也没有导眼。水泥返高那一列逐行都等于
# 该段套管的顶深（返高 0 的行顶深就是 0），也就是**每段都是整段固井**，
# 于是 `cement:` 那一层整批不写——缺省正是 `full`。

wellInfo:
  test-well: 35.57      # 井名当键、井斜角当值（轨迹表里稳斜段的井斜 35.57°）
  Depth: 6521         # 总井深 = 五开底深，与目标点 B 同深

keyPoints:
  keypoint: 5100            # 造斜点：轨迹表 5100m（无导眼 ⇒ 落成造斜点）
  A: [6090.95, 5950]        # 靶点A：井深 + 垂深，两个都必须写（它是锚）
  B: auto                   # 完钻点 = 最大井深（五开底深 6521），垂深按 35.57° 推
  hide: [keypoint, A, B]    # 原图上不标这三个记号（几何照用，只是别画）

stratigraphy:
  # 数组写法：逐层只写底深，顶深由上一层给（首层 0）。层序就是书写顺序，
  # 右侧那个数是**底深不是厚度**。深度基准：垂深。
  - name: 沙溪庙组
    bottomDepth_m: 30
  - name: 沙溪庙组
    bottomDepth_m: 400
  - name: 沙溪庙组~须家河组底
    bottomDepth_m: 1670
  - name: 须家河组底~嘉五1亚段顶
    bottomDepth_m: 2198
  - name: 嘉五1亚段~嘉三段
    bottomDepth_m: 2695
  - name: 嘉二段~长兴组底
    bottomDepth_m: 3760
  - name: 长兴组底~茅口组顶
    bottomDepth_m: 3933
  - name: 茅口组
    bottomDepth_m: 4210
  - name: 栖霞组~黄龙组顶
    bottomDepth_m: 4353
  - name: 黄龙组
    bottomDepth_m: 4385
  - name: 韩家店组~龙马溪组
    bottomDepth_m: 5490
  - name: 五峰组~桐梓组
    bottomDepth_m: 5950
  - name: 洗象池组~高台组
    bottomDepth_m: 6300

drillingFluidAndPressure:
  # 行式写法：`[底深, 孔隙压力, [窗口 min, 窗口 max]]`。
  # 孔隙压力取表里的「地层压力系数」（数值上等于 g/cm³ 当量密度），窗口取「钻井液密度」。
  # 顶深接上一行的底深（首段 0）；边界与地层逐条重合。深度基准：垂深。
  # 0.50 / 0.50 / 0.11 这三段落在量程 [0.90, 2.00] 左端之外，会被画在栏边界上并打 ⚠️
  # ——原图上那三条红线就钉在栏的左缘。
  - [30, 1.0, [1.02, 1.05]]
  - [400, 1.0, [1.05, 1.10]]
  - [1670, 1.0, [1.07, 1.15]]
  - [2198, 1.15, [1.22, 1.30]]
  - [2695, 0.5, [1.02, 1.05]]
  - [3760, 1.2, [1.27, 1.35]]
  - [3933, 1.5, [1.57, 1.65]]
  - [4210, 0.5, [1.02, 1.05]]
  - [4353, 1.5, [1.57, 1.65]]
  - [4385, 0.11, [1.02, 1.05]]
  - [5490, 1.65, [1.72, 1.80]]
  - [5950, 1.55, [1.72, 1.80]]
  - [6300, 1.55, [1.72, 1.80]]

# 密度轴量程照原图取 [0.90, 2.00]（原图横轴刻度就是这两端）。
fluidDensityAxis: [0.90, 2.00]

holeSections:
  # 位置式写法：一行一开次，子层缩进挂在下面。深度基准：斜深（井深）。
  # 每段套管的水泥返高都等于它自己的顶深 ⇒ 整段固井 ⇒ `cement:` 那一层整批省掉。
  - sec: [30, 914.4]                 # 导管 Φ914.4mm(36″) 井眼
    casings:
      - cas: [30, 813]               # Φ813mm(32″) × (0-30m)

  - sec: [400, 762]                  # 一开 Φ762mm(30″) 井眼
    casings:
      - cas: [398, 609.6]            # Φ609.6mm(24″) × (0-398m)

  - sec: [2198, 558.8]               # 二开 Φ558.8mm(22″) 井眼
    casings:
      - cas: [1750, 473.08]          # Φ473.08mm(18 5/8″) × (0-1750m)
      - cas: [[1750, 2196], 482.6]   # Φ482.6mm(19″) × (1750-2196m)（上小下大，照表）

  - sec: [3933, 431.8]               # 三开 Φ431.8mm(17″) 井眼
    casings:
      - cas: [500, 374.65]           # Φ374.65mm(14 3/4″) × (0-500m)
      - cas: [[500, 2196], 365.1]    # Φ365.1mm(14 3/8″) × (500-2196m)
      - cas: [[2196, 2550], 374.65]  # Φ374.65mm(14 3/4″) × (2196-2550m)（上小下大，照表）
      - cas: [[2550, 3931], 365.1]   # Φ365.1mm(14 3/8″) × (2550-3931m)

  - sec: [4353, 333.4]               # 四开 Φ333.4mm(13 1/8″) 井眼
    casings:
      - cas: [500, 282.58]           # Φ282.58mm(11 1/8″) × (0-500m)
      - cas: [[500, 3850], 273.05]   # Φ273.05mm(10 3/4″) × (500-3850m)
      - cas: [[3850, 4351], 282.58]  # Φ282.58mm(11 1/8″) × (3850-4351m)（上小下大，照表）

  - sec: [6521, 241.3]               # 五开 Φ241.3mm(9 1/2″) 井眼
    casings:
      - cas: [3951, 177.8]           # Φ177.8mm(7″) × (0-3951m)
      - cas: [[3951, 6519], 177.8]   # Φ177.8mm(7″) × (3951-6519m)
